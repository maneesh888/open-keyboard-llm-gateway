version: "3.8"

services:
  llm-gateway:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
    container_name: llm-gateway
    restart: unless-stopped
    ports:
      - "8880:8080"
    environment:
      - CODEX_API_KEY
    volumes:
      - ./config/keys.json:/app/config/keys.json
      - ./config/config.json:/app/config/config.json:ro
      - ./config/admin.json:/app/config/admin.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gateway-net
    security_opt:
      - no-new-privileges:true

networks:
  gateway-net:
    driver: bridge
