name: LLM Gateway CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Install locked dependencies
        run: npm ci

      - name: Run repository hygiene
        run: ./scripts/check.sh --hygiene

  tests:
    name: Node ${{ matrix.node }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node:
          - 24
          - 22
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run Vitest suite
        run: npm test

  build:
    name: Node 24 TypeScript build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

  docker-smoke:
    name: Docker runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Build and smoke-test the image
        run: ./scripts/docker-smoke.sh

  semantic-contract:
    name: Semantic prompt contract (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node:
          - 24
          - 22
    steps:
      - name: Check out exact candidate and pinned contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: Vendor/semantic-prompt-contract/package-lock.json

      - name: Validate pinned semantic contract
        run: ./scripts/check-semantic-prompt-contract.sh

  required-checks:
    name: Required checks
    if: always()
    runs-on: ubuntu-latest
    needs:
      - hygiene
      - tests
      - build
      - docker-smoke
      - semantic-contract
    steps:
      - name: Confirm required jobs passed
        env:
          HYGIENE_RESULT: ${{ needs.hygiene.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DOCKER_RESULT: ${{ needs.docker-smoke.result }}
          SEMANTIC_CONTRACT_RESULT: ${{ needs.semantic-contract.result }}
        run: |
          if [[ "$HYGIENE_RESULT" != "success" ||
                "$TESTS_RESULT" != "success" ||
                "$BUILD_RESULT" != "success" ||
                "$DOCKER_RESULT" != "success" ||
                "$SEMANTIC_CONTRACT_RESULT" != "success" ]]; then
            echo "Required checks did not pass."
            echo "hygiene=$HYGIENE_RESULT"
            echo "tests=$TESTS_RESULT"
            echo "build=$BUILD_RESULT"
            echo "docker=$DOCKER_RESULT"
            echo "semantic-contract=$SEMANTIC_CONTRACT_RESULT"
            exit 1
          fi

          echo "All required LLM Gateway checks passed."
