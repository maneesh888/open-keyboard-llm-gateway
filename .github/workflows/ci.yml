name: LLM Gateway CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verification-scope:
    name: Trusted verification scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - name: Check out exact candidate and base history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Classify complete diff from trusted policy
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          scope=full
          if [[ "$EVENT_NAME" == pull_request || "$EVENT_NAME" == push ]]; then
            scope="$(./scripts/select-verification-scope.sh --range "$BASE_SHA" "$HEAD_SHA")"
            git diff --check "$BASE_SHA...$HEAD_SHA"
          fi
          case "$scope" in docs|full) ;; *) exit 1 ;; esac
          echo "scope=$scope" >> "$GITHUB_OUTPUT"

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Install locked dependencies
        run: npm ci

      - name: Run repository hygiene
        run: ./scripts/check.sh --hygiene

  tests:
    needs: verification-scope
    if: needs.verification-scope.outputs.scope == 'full'
    name: Node ${{ matrix.node }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node:
          - 24
          - 22
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run Vitest suite
        run: npm test

  build:
    needs: verification-scope
    if: needs.verification-scope.outputs.scope == 'full'
    name: Node 24 TypeScript build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

  docker-smoke:
    needs: verification-scope
    if: needs.verification-scope.outputs.scope == 'full'
    name: Docker runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Build and smoke-test the image
        run: ./scripts/docker-smoke.sh

  semantic-contract:
    needs: verification-scope
    if: needs.verification-scope.outputs.scope == 'full'
    name: Semantic prompt contract (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node:
          - 24
          - 22
    steps:
      - name: Check out exact candidate and pinned contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: Vendor/semantic-prompt-contract/package-lock.json

      - name: Validate pinned semantic contract
        run: ./scripts/check-semantic-prompt-contract.sh

  browser-e2e:
    needs: verification-scope
    if: needs.verification-scope.outputs.scope == 'full'
    name: Browser and API E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies and browser
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run isolated fixture journeys
        run: ./scripts/check-e2e.sh

  required-checks:
    name: Required checks
    if: always()
    runs-on: ubuntu-latest
    needs:
      - verification-scope
      - hygiene
      - tests
      - build
      - docker-smoke
      - browser-e2e
      - semantic-contract
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Confirm required jobs passed
        env:
          VERIFICATION_SCOPE: ${{ needs.verification-scope.outputs.scope }}
          SCOPE_RESULT: ${{ needs.verification-scope.result }}
          HYGIENE_RESULT: ${{ needs.hygiene.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_RESULT: ${{ needs.browser-e2e.result }}
          DOCKER_RESULT: ${{ needs.docker-smoke.result }}
          SEMANTIC_RESULT: ${{ needs.semantic-contract.result }}
        run: |
          # $BROWSER_RESULT must succeed for Full; only docs permits an intentional skip.
          node scripts/validate-check-results.mjs
